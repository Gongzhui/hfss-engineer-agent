[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfss-mcp"
version = "0.1.0"
description = "Host Agent skill + constrained tools so an LLM tunes HFSS antennas like an engineer (joint Parametric), not a script runner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]>=1.28,<2",
    "pyaedt>=1.3,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2,<3",
    "pywin32>=306; platform_system == 'Windows'",
    "pythonnet>=3.0; platform_system == 'Windows'",
]

[project.scripts]
hfss-mcp = "hfss_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hfss_mcp"]
artifacts = ["src/hfss_mcp/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_aedt: requires local AEDT 2023 R2 (attaches user-style GUI via COM ROT)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM102"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hfss_mcp"]
exclude = ["^references/"]
